{% extends 'base.html' %}

{% block title %}申請請假 - ShiftMaster Pro{% endblock %}

{% block content %}
<div class="form-card" style="max-width: 600px; margin: 0 auto; background: var(--card-bg); padding: 2.5rem; border-radius: 1rem;">
    <h2 style="margin-bottom: 2rem;">填寫請假申請</h2>
    
    <form method="POST">
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1.5rem;">
            <div class="form-group">
                <label style="display: block; margin-bottom: 0.5rem; color: var(--text-muted);">開始時間</label>
                <input type="datetime-local" name="start_date" required style="width: 100%; padding: 0.75rem; border-radius: 0.5rem; background: var(--bg-dark); border: 1px solid #334155; color: white;">
            </div>
            <div class="form-group">
                <label style="display: block; margin-bottom: 0.5rem; color: var(--text-muted);">結束時間</label>
                <input type="datetime-local" name="end_date" required style="width: 100%; padding: 0.75rem; border-radius: 0.5rem; background: var(--bg-dark); border: 1px solid #334155; color: white;">
            </div>
        </div>
        
        <div class="form-group" style="margin-bottom: 2rem;">
            <label style="display: block; margin-bottom: 0.5rem; color: var(--text-muted);">請假理由</label>
            <textarea name="reason" rows="4" style="width: 100%; padding: 0.75rem; border-radius: 0.5rem; background: var(--bg-dark); border: 1px solid #334155; color: white;"></textarea>
        </div>
        
        <div style="display: flex; gap: 1rem;">
            <button type="submit" class="btn" style="flex: 1;">提交申請</button>
            <a href="{{ url_for('main.index') }}" class="btn" style="background: transparent; border: 1px solid #334155; flex: 1; text-align: center;">取消</a>
        </div>
    </form>
</div>
{% endblock %}
