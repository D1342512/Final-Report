{% extends 'base.html' %}

{% block title %}登入 - ShiftMaster Pro{% endblock %}

{% block content %}
<div class="login-container" style="max-width: 400px; margin: 4rem auto; background: var(--card-bg); padding: 2.5rem; border-radius: 1rem; border: 1px solid #334155;">
    <h2 style="text-align: center; margin-bottom: 2rem;">登入系統</h2>
    
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category }}" style="padding: 0.75rem; border-radius: 0.5rem; margin-bottom: 1rem; background: rgba(244, 63, 94, 0.2); color: #fb7185; border: 1px solid #f43f5e;">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form method="POST">
        <div class="form-group" style="margin-bottom: 1.5rem;">
            <label style="display: block; margin-bottom: 0.5rem; color: var(--text-muted);">使用者帳號</label>
            <input type="text" name="username" required style="width: 100%; padding: 0.75rem; border-radius: 0.5rem; background: var(--bg-dark); border: 1px solid #334155; color: white; box-sizing: border-box;">
        </div>
        <div class="form-group" style="margin-bottom: 2rem;">
            <label style="display: block; margin-bottom: 0.5rem; color: var(--text-muted);">密碼</label>
            <input type="password" name="password" required style="width: 100%; padding: 0.75rem; border-radius: 0.5rem; background: var(--bg-dark); border: 1px solid #334155; color: white; box-sizing: border-box;">
        </div>
        <button type="submit" class="btn" style="width: 100%; padding: 0.75rem;">登入</button>
    </form>
</div>
{% endblock %}
